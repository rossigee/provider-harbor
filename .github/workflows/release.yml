# Custom Release Workflow for provider-harbor
# Publishes to ghcr.io/rossigee using the crossplane build system.
name: Release (Official Workflows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init build submodule
        run: git submodule update --init --depth 1 build

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Docker Images
        run: |
          set -e

          export VERSION="${{ steps.version.outputs.version }}"
          export REGISTRY="ghcr.io/${{ github.repository_owner }}"
          export IMAGE_NAME="harbor"

          echo "Building and pushing ${REGISTRY}/${IMAGE_NAME}:${VERSION}"

          make build.all

          docker buildx build \
            --push \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            --platform linux/amd64,linux/arm64 \
            ./cluster/images/provider-harbor

      - name: Verify Publication
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY_PATH="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"

          echo "Verifying publication to ${REGISTRY_PATH}:${VERSION}"
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
            echo "✅ Verified container image ${VERSION} (${DIGEST})"
          else
            echo "❌ Failed to pull container image ${VERSION}"
            exit 1
          fi

      - name: Upload XPKG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpkg
          path: _output/xpkg/linux_amd64/provider-harbor-${{ steps.version.outputs.version }}.xpkg

  publish:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write

    steps:
      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
