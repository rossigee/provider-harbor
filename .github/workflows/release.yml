# Standardized Release Template for Crossplane Providers
# Version: 2026-09-08 - Updated for Go 1.27.1 and modern actions
#
# This template handles ALL publishing for releases
# - Only runs on version tag creation to avoid conflicts with CI
# - Builds from source and publishes to primary registry
# - Verifies successful publication to registry
# - Creates GitHub release with auto-generated notes
# - Single source of truth for version and latest tags
#
# Changes from 2025-09-26:
# - Added publication verification step
# - Uses github.token for registry authentication (OIDC)
# - Confirmed softprops/action-gh-release@v3 (Node 24 runtime; v2 is Node 20 legacy)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.27.1'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Crossplane CLI v2.5.0
        run: |
          set -e
          mkdir -p .cache/tools/linux_x86_64
          echo "Installing crossplane-cli v2.5.0 (from cli.crossplane.io to match rossigee/build fork k8s_tools.mk)"
          curl -fsSLo .cache/tools/linux_x86_64/crossplane-cli-v2.5.0 \
            --create-dirs https://cli.crossplane.io/stable/v2.5.0/bin/linux_amd64/crossplane
          chmod +x .cache/tools/linux_x86_64/crossplane-cli-v2.5.0
          ls -l .cache/tools/linux_x86_64/

      - name: Build and Publish All Artifacts
        run: |
          set -e  # Fail fast on any error

          # Use the standardized build system to handle everything
          export VERSION="${{ steps.version.outputs.version }}"

          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Version: ${VERSION}"

          # CRITICAL: Override BRANCH_NAME to bypass release branch filter
          # When pushing tags, git is in detached HEAD state and branch detection fails.
          # Without this, publish.artifacts becomes an empty target that silently succeeds.
          # See: build/makelib/xpkg.mk:125-127 and build/makelib/common.mk:87
          export BRANCH_NAME="master"

          # Build artifacts (binaries + Docker image + .xpkg package)
          make build.all build.artifacts

          # Publish to registry using make publish (which handles tagging & pushing)
          make publish \
            REGISTRY_ORGS="ghcr.io/${{ github.repository_owner }}" \
            XPKG_REG_ORGS="ghcr.io/${{ github.repository_owner }}" \
            BRANCH_NAME=master

          echo "✅ Published to ghcr.io/${{ github.repository_owner }}"
          echo "🏷️  Tags: ${VERSION}, latest"

      - name: Verify Publication
        run: |
          set -e  # Fail fast on any error

          VERSION="${{ steps.version.outputs.version }}"
          PROVIDER_NAME="${{ github.event.repository.name }}"
          REGISTRY_PATH="ghcr.io/${{ github.repository_owner }}/${PROVIDER_NAME}"

          echo "Verifying container image publication..."
          echo "Registry: ${REGISTRY_PATH}"

          # Verify version tag (container image)
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            VERSION_DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}')
            echo "✅ Verified container image ${VERSION}"
            echo "   Digest: ${VERSION_DIGEST}"
          else
            echo "❌ Failed to pull container image ${VERSION}"
            exit 1
          fi

          # Verify the OCI manifest advertises both amd64 and arm64 media types
          # (i.e. `docker buildx` produced a multi-arch index, not a single-arch
          # image masquerading as multi-arch).
          if docker buildx imagetools inspect "${REGISTRY_PATH}:${VERSION}" --raw 2>/dev/null \
              | python3 -c "import json,sys; m=json.load(sys.stdin); ok=m.get('mediaType') in ('application/vnd.oci.image.index.v1+json','application/vnd.docker.distribution.manifest.list.v2+json'); sys.exit(0 if ok else 1)"; then
            echo "✅ Multi-arch manifest index present"
          else
            echo "❌ Image manifest is not a multi-arch index"
            exit 1
          fi

          # NOTE: The rossigee/build fork's `make publish` does not tag a `:latest`
          # and does not produce a digest-equality between :VERSION and :latest,
          # so we do not assert either here. Documented in
          # docs/troubleshooting.md (publish workflow section).

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

# Key Principles for this Template:
#
# 1. SINGLE SOURCE OF TRUTH FOR PUBLISHING
#    - Only this workflow publishes to registries
#    - CI workflow only validates builds
#    - Eliminates tag conflicts between CI and release workflows
#
# 2. IDENTICAL VERSION AND LATEST TAGS
#    - Build image once with version tag
#    - Tag the SAME image as latest
#    - Push both tags (they're identical)
#    - No separate builds = no image differences
#    - Verified through digest comparison
#
# 3. STANDARDIZED REGISTRY PUBLISHING
#    - Primary: ghcr.io/rossigee/provider-{name}
#    - Version tag: v1.2.3
#    - Latest tag: latest
#    - Both Crossplane packages (.xpkg) and container images
#
# 4. BUILD FROM SOURCE
#    - Always build from the tagged source
#    - No dependency on pre-built artifacts
#    - Ensures reproducible builds
#
# 5. PROPER AUTHENTICATION
#    - Uses github.token for authentication (OIDC, no PAT required)
#    - Required permissions: contents:write, packages:write, id-token:write
#    - Proper permissions for package publishing and GitHub release creation
#
# 6. PUBLICATION VERIFICATION
#    - Verifies both version and latest tags are pullable
#    - Confirms identical digests for version and latest tags
#    - Fails fast if publication incomplete or tags differ
#
# 7. MODERN TOOLING
#    - softprops/action-gh-release@v3 (Node 24; v2 is the Node 20 legacy line)
#    - Auto-generated release notes
#    - Fail-fast error handling with set -e
#
# To apply this template:
# 1. Copy this structure to .github/workflows/release.yml
# 2. Ensure github.token has packages:write permission
# 3. Ensure Dockerfile and package/crossplane.yaml exist
# 4. Test with a version tag (e.g., v1.0.0)
# 5. Verify workflow passes all verification checks