name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.27.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Determine Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          git fetch origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "Release tag must point at the current origin/master commit" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tools/linux_x86_64
          curl -fsSLo .cache/tools/linux_x86_64/crossplane-cli-v2.5.0 \
            --create-dirs https://cli.crossplane.io/stable/v2.5.0/bin/linux_amd64/crossplane
          chmod +x .cache/tools/linux_x86_64/crossplane-cli-v2.5.0

      - name: Build and Publish Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          platforms=(linux_amd64 linux_arm64)
          provider_name="${GITHUB_REPOSITORY##*/}"
          registry_org="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          registry_path="${registry_org}/${provider_name}"
          export BRANCH_NAME=master
          make build.all build.artifacts VERSION="$VERSION" PLATFORMS="${platforms[*]}"
          for platform in "${platforms[@]}"; do
            make xpkg.build VERSION="$VERSION" PLATFORMS="${platforms[*]}" PLATFORM="$platform"
            test -f "_output/xpkg/${platform}/${provider_name}-${VERSION}.xpkg"
          done
          make publish \
            VERSION="$VERSION" \
            PLATFORMS="${platforms[*]}" \
            REGISTRY_ORGS="$registry_org" \
            XPKG_REG_ORGS="$registry_org" \
            BRANCH_NAME=master
          docker buildx imagetools create --tag "${registry_path}:latest" "${registry_path}:${VERSION}"

      - name: Verify Publication
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          provider_name="${GITHUB_REPOSITORY##*/}"
          registry_path="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${provider_name}"
          verify_manifest() {
            local ref="$1"
            local digest
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            docker buildx imagetools inspect "$ref" --raw | python3 -c '
          import json
          import sys
          manifest = json.load(sys.stdin)
          media_type = manifest.get("mediaType")
          allowed_media_types = {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }
          if media_type not in allowed_media_types:
              raise SystemExit(f"unsupported manifest media type: {media_type}")
          platforms = set()
          for entry in manifest.get("manifests", []):
              platform = entry.get("platform") or {}
              platforms.add((platform.get("os"), platform.get("architecture")))
          required = {("linux", "amd64"), ("linux", "arm64")}
          if not required.issubset(platforms):
              raise SystemExit(f"missing required platforms: {sorted(required - platforms)}")
          '
            echo "$ref $digest"
          }
          version_digest="$(verify_manifest "${registry_path}:${VERSION}" | cut -d' ' -f2)"
          latest_digest="$(verify_manifest "${registry_path}:latest" | cut -d' ' -f2)"
          if [[ "$version_digest" != "$latest_digest" ]]; then
            echo "Version and latest digests differ" >&2
            exit 1
          fi
          echo "Published $registry_path:$VERSION and $registry_path:latest as $version_digest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
