---
# Standardized Release Workflow for Crossplane Providers
# Version: 2026-06-09 - Unified publish pattern across all providers
#
# Pattern:
# 1. Build provider binaries and packages (make build)
# 2. Publish to GHCR in a SINGLE step using make publish with both:
#    - REGISTRY_ORGS for Docker images
#    - XPKG_REG_ORGS for Crossplane packages
# 3. Create GitHub release
#
# Triggered on version tags (v*)

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.6'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: |
          go mod vendor
          make vendor.check

      - name: Init build submodule
        run: git submodule update --init --depth 1 build

