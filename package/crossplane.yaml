apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-harbor
  annotations:
    meta.crossplane.io/maintainer: Ross Golder
    meta.crossplane.io/source: github.com/rossigee/provider-harbor
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Native Harbor Crossplane provider for managing Harbor container
      registry resources using the official Harbor Go client.

    meta.crossplane.io/readme: |
      `provider-harbor` is a native Crossplane provider for
      [Harbor](https://goharbor.io/) container registry management.

      Uses the official Harbor Go client for direct API integration
      without Terraform dependencies. Read the
      [readme](https://github.com/rossigee/provider-harbor/blob/main/README.md)
      for instructions.
spec:
  permissionRequests:
  - apiGroups:
    - harbor.crossplane.io
    - harbor.m.crossplane.io
    - artifact.harbor.m.crossplane.io
    - member.harbor.m.crossplane.io
    - project.harbor.m.crossplane.io
    - registry.harbor.m.crossplane.io
    - replication.harbor.m.crossplane.io
    - repository.harbor.m.crossplane.io
    - retention.harbor.m.crossplane.io
    - robot.harbor.m.crossplane.io
    - scan.harbor.m.crossplane.io
    - scanner.harbor.m.crossplane.io
    - user.harbor.m.crossplane.io
    - usergroup.harbor.m.crossplane.io
    - webhook.harbor.m.crossplane.io
    resources:
    - artifacts
    - artifacts/status
    - members
    - members/status
    - projects
    - projects/status
    - registries
    - registries/status
    - replications
    - replications/status
    - repositories
    - repositories/status
    - retentions
    - retentions/status
    - robots
    - robots/status
    - scans
    - scans/status
    - scannerregistrations
    - scannerregistrations/status
    - users
    - users/status
    - usergroups
    - usergroups/status
    - webhooks
    - webhooks/status
    - providerconfigs
    - providerconfigs/status
    - providerconfigusages
    - providerconfigusages/status
    verbs:
    - "*"
  - apiGroups:
    - events.k8s.io
    resources:
    - events
    verbs:
    - "*"
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  controller: {}
