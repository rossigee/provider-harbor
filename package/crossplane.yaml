apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-harbor
  annotations:
    meta.crossplane.io/maintainer: Ross Golder
    meta.crossplane.io/source: github.com/rossigee/provider-harbor
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Native Harbor Crossplane provider for managing Harbor container
      registry resources using the official Harbor Go client.

    meta.crossplane.io/readme: |
      `provider-harbor` is a native Crossplane provider for
      [Harbor](https://goharbor.io/) container registry management.

      Uses the official Harbor Go client for direct API integration
      without Terraform dependencies. Read the
      [readme](https://github.com/rossigee/provider-harbor/blob/main/README.md)
      for instructions.
spec:
  permissionRequests:
  - apiGroups:
    - harbor.crossplane.io
    - harbor.m.crossplane.io
    resources:
    - projects
    - projects/status
    - repositories
    - repositories/status
    - providerconfigs
    - providerconfigs/status
    - providerconfigusages
    - providerconfigusages/status
    verbs:
    - "*"
  - apiGroups:
    - events.k8s.io
    resources:
    - events
    verbs:
    - "*"
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
  controller: {}
