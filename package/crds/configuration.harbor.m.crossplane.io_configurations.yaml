---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: configurations.configuration.harbor.m.crossplane.io
spec:
  group: configuration.harbor.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - harbor
    kind: Configuration
    listKind: ConfigurationList
    plural: configurations
    singular: configuration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .spec.forProvider.authMode
      name: AUTH-MODE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          A Configuration manages the system-wide authentication settings of the Harbor
          instance selected by its ProviderConfig. Create one per instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ConfigurationSpec defines the desired state of a Configuration.
            properties:
              forProvider:
                description: |-
                  ConfigurationParameters define the desired system-wide authentication
                  settings of a Harbor instance. A Configuration manages one Harbor instance,
                  selected by the ProviderConfig it references.
                properties:
                  authMode:
                    description: AuthMode is Harbor's primary authentication mode.
                    enum:
                    - db_auth
                    - ldap_auth
                    - http_auth
                    - oidc_auth
                    - uaa_auth
                    type: string
                  oidc:
                    description: OIDC holds the OpenID Connect settings. Only applied
                      when they are set.
                    properties:
                      adminGroup:
                        description: |-
                          AdminGroup is the group whose members become Harbor system administrators.
                          Set to an empty string to clear it.
                        type: string
                      autoOnboard:
                        description: AutoOnboard creates Harbor users automatically
                          on first OIDC login.
                        type: boolean
                      clientId:
                        description: ClientID is the OIDC client identifier Harbor
                          authenticates as.
                        type: string
                      clientSecretRef:
                        description: |-
                          ClientSecretRef references the OIDC client secret. Harbor never returns
                          the secret, so changes are detected by comparing a hash of the value.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      endpoint:
                        description: |-
                          Endpoint is the OIDC issuer URL, for example
                          https://sso.example.com/auth/realms/Realm.
                        type: string
                      groupFilter:
                        description: GroupFilter is a regular expression that limits
                          which groups are imported.
                        type: string
                      groupsClaim:
                        description: GroupsClaim is the ID token claim that lists
                          the user's groups.
                        type: string
                      logout:
                        description: Logout makes Harbor's logout also end the OIDC
                          session.
                        type: boolean
                      name:
                        description: Name is the label shown on the Harbor login page
                          for the OIDC provider.
                        type: string
                      scope:
                        description: Scope is the space-separated list of OIDC scopes
                          to request.
                        type: string
                      userClaim:
                        description: UserClaim is the ID token claim used as the Harbor
                          username.
                        type: string
                      verifyCert:
                        default: true
                        description: |-
                          VerifyCert controls whether Harbor verifies the OIDC provider's TLS
                          certificate.
                        type: boolean
                    type: object
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A ConfigurationStatus represents the observed state of a
              Configuration.
            properties:
              atProvider:
                description: ConfigurationObservation are the observed Harbor settings.
                properties:
                  authMode:
                    description: AuthMode is the authentication mode Harbor currently
                      uses.
                    type: string
                  oidcClientSecretHash:
                    description: |-
                      OIDCClientSecretHash is the SHA-256 (hex) of the OIDC client secret last
                      written to Harbor. It is used to detect rotation of the referenced secret.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
